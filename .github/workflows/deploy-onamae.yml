name: Deploy to Onamae Rental Server

on:
  push:
    branches:
      - main
      - master
      - work
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy archive
        run: |
          echo "📦 Preparing deployment archive..."
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.DS_Store' \
            --exclude='node_modules' \
            --exclude='.env' \
            -czf /tmp/deploy.tar.gz .
          ls -lh /tmp/deploy.tar.gz

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "🔐 Setting up SSH..."
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          # SSH設定
          cat > ~/.ssh/config << 'EOF'
          Host *
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
            ConnectTimeout 10
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config
          echo "✅ SSH configured"

      - name: Test SSH connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          echo "📡 Testing SSH connection to $SSH_USER@$SSH_HOST:$SSH_PORT..."
          ssh -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=10 \
              -p "$SSH_PORT" \
              "$SSH_USER@$SSH_HOST" \
              "echo '✅ SSH connection successful' && pwd && whoami" || {
            echo "❌ SSH connection failed"
            exit 1
          }

      - name: Upload archive via SCP
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          echo "📤 Uploading deployment archive..."
          ARCHIVE_NAME="sb_test-${GITHUB_SHA:0:7}.tar.gz"
          
          scp -P "$SSH_PORT" \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=10 \
              /tmp/deploy.tar.gz \
              "$SSH_USER@$SSH_HOST:/tmp/$ARCHIVE_NAME" || {
            echo "❌ Upload failed"
            exit 1
          }
          
          echo "✅ Upload successful"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "ls -lh /tmp/$ARCHIVE_NAME"

      - name: Deploy files
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          echo "🚀 Starting deployment..."
          ARCHIVE_NAME="sb_test-${GITHUB_SHA:0:7}.tar.gz"
          
          ssh -p "$SSH_PORT" \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=10 \
              "$SSH_USER@$SSH_HOST" << EOF
          set -e
          echo "📂 Working directory: \$(pwd)"
          echo "📋 Creating directories..."
          mkdir -p "$REMOTE_PATH"
          mkdir -p "$REMOTE_PATH/.backups"
          
          echo "✅ Directories created"
          echo "💾 Backing up existing files..."
          
          if [ -d "$REMOTE_PATH" ] && [ -n "\$(find $REMOTE_PATH -maxdepth 1 ! -name '.backups' ! -name '.' ! -name '..' -print -quit 2>/dev/null || true)" ]; then
            BACKUP_TIME=\$(date +%Y%m%d-%H%M%S)
            tar -czf "$REMOTE_PATH/.backups/predeploy-\$BACKUP_TIME.tar.gz" \\
              --exclude='.backups' \\
              -C "$REMOTE_PATH" . 2>/dev/null || true
            echo "✅ Backup created: predeploy-\$BACKUP_TIME.tar.gz"
          else
            echo "ℹ️  No existing files to backup"
          fi
          
          echo "📦 Extracting archive..."
          tar -xzf "/tmp/$ARCHIVE_NAME" -C "$REMOTE_PATH"
          
          echo "🧹 Cleaning up..."
          rm -f "/tmp/$ARCHIVE_NAME"
          
          echo "📋 Deployed files:"
          ls -la "$REMOTE_PATH" | head -15
          
          echo "✅ Deployment completed successfully"
          EOF

      - name: Verify deployment
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          echo "🔍 Verifying deployment..."
          ssh -p "$SSH_PORT" \
              -o StrictHostKeyChecking=accept-new \
              "$SSH_USER@$SSH_HOST" \
              "test -f '$REMOTE_PATH/webhook.php' && echo '✅ webhook.php found' || (echo '❌ webhook.php not found' && exit 1)"
          
          ssh -p "$SSH_PORT" \
              -o StrictHostKeyChecking=accept-new \
              "$SSH_USER@$SSH_HOST" \
              "test -f '$REMOTE_PATH/api_utils.php' && echo '✅ api_utils.php found' || (echo '❌ api_utils.php not found' && exit 1)"
          
          echo "✅ All critical files verified"

      - name: Success notification
        if: success()
        run: |
          echo "🎉 Deployment to luxewave.jp completed successfully!"
          echo "📝 Check the deployed files:"
          echo "   - webhook.php (webhook handler)"
          echo "   - api_utils.php (API utilities)"
          echo "   - setup_webhook.php (webhook setup)"
