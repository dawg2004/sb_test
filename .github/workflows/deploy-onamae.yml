name: Deploy to Onamae Rental Server

on:
  push:
    branches:
      - main
      - master
      - work
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy archive
        run: |
          echo "📦 Preparing deployment archive..."
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.DS_Store' \
            --exclude='node_modules' \
            --exclude='.env' \
            -czf /tmp/deploy.tar.gz .
          ls -lh /tmp/deploy.tar.gz
          echo "✅ Archive prepared"

      - name: Setup SSH key and known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          echo "🔐 Setting up SSH connection..."
          
          # SSH ディレクトリの作成
          install -m 700 -d ~/.ssh
          
          # SSH鍵の書き込み
          printf "%s" "$SSH_PRIVATE_KEY" | sed 's/\\n/\n/g' | tr -d "\r" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          # SSH設定ファイルの作成
          cat > ~/.ssh/config << 'EOF'
          Host onamae
            User ${{ secrets.SSH_USER }}
            HostName ${{ secrets.SSH_HOST }}
            Port ${{ secrets.SSH_PORT }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
            ConnectTimeout 10
            ServerAliveInterval 60
            ServerAliveCountMax 3
            ControlMaster auto
            ControlPath ~/.ssh/control-%C
            ControlPersist 600
          EOF
          chmod 600 ~/.ssh/config
          
          # known_hosts の取得
          CLEAN_SSH_HOST=$(printf "%s" "${{ secrets.SSH_HOST }}" | tr -d "\r\n[:space:]")
          CLEAN_SSH_PORT=$(printf "%s" "${{ secrets.SSH_PORT }}" | tr -d "\r\n[:space:]")
          echo "🔑 Scanning host key for $CLEAN_SSH_HOST:$CLEAN_SSH_PORT..."
          ssh-keyscan -T 10 -p "$CLEAN_SSH_PORT" "$CLEAN_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || echo "⚠️ Host key scan completed with status $?"
          chmod 644 ~/.ssh/known_hosts
          
          # SSH接続テスト
          echo "📡 Testing SSH connection..."
          ssh -v -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo '✅ SSH connection successful'; whoami; pwd" || exit 1

      - name: Upload archive
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          echo "📤 Uploading deployment archive..."
          
          # リトライ付きでファイルアップロード
          MAX_RETRIES=3
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "📤 Upload attempt $((RETRY_COUNT + 1))/$MAX_RETRIES"
            
            if scp -v \
              -P "${{ secrets.SSH_PORT }}" \
              -o ConnectTimeout=10 \
              -o StrictHostKeyChecking=accept-new \
              /tmp/deploy.tar.gz \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/sb_test-${GITHUB_SHA}.tar.gz"; then
              
              echo "✅ Upload successful"
              
              # アップロード確認
              ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "ls -lh /tmp/sb_test-${GITHUB_SHA}.tar.gz"
              exit 0
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              WAIT_TIME=$((RETRY_COUNT * 5))
              echo "⏳ Retrying in ${WAIT_TIME}s..."
              sleep $WAIT_TIME
            fi
          done
          
          echo "❌ Upload failed after $MAX_RETRIES attempts"
          exit 1

      - name: Backup and deploy (non-destructive)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          echo "🚀 Starting deployment..."
          
          ssh -v -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} bash << 'ENDSSH'
            set -eu
            
            GITHUB_SHA="${{ github.sha }}"
            REMOTE_PATH="${{ secrets.REMOTE_PATH }}"
            
            echo "📂 Creating directories..."
            mkdir -p "$REMOTE_PATH"
            mkdir -p "$REMOTE_PATH/.backups"
            
            # パーミッション確認
            echo "🔍 Checking permissions..."
            ls -ld "$REMOTE_PATH"
            
            # バックアップ作成（既存ファイルがある場合）
            if [ -n "$(find "$REMOTE_PATH" -mindepth 1 -maxdepth 1 ! -name '.backups' -print -quit 2>/dev/null || true)" ]; then
              TS=$(date +%Y%m%d-%H%M%S)
              echo "💾 Backing up existing files to predeploy-$TS.tar.gz..."
              tar -czf "$REMOTE_PATH/.backups/predeploy-$TS.tar.gz" \
                --exclude='.backups' \
                -C "$REMOTE_PATH" . || echo "⚠️ Backup creation had issues, continuing..."
              echo "✅ Backup completed"
            else
              echo "ℹ️ No existing files to backup"
            fi
            
            # 展開処理
            echo "📦 Extracting deployment archive..."
            tar -tzf /tmp/sb_test-$GITHUB_SHA.tar.gz | head -20
            tar -xzf /tmp/sb_test-$GITHUB_SHA.tar.gz -C "$REMOTE_PATH"
            echo "✅ Archive extracted"
            
            # 不要なファイル削除
            echo "🧹 Cleaning up..."
            rm -f /tmp/sb_test-$GITHUB_SHA.tar.gz
            
            # デプロイ完了確認
            echo "📋 Deployed files:"
            ls -la "$REMOTE_PATH" | head -20
            echo "✅ Deployment completed successfully"
          ENDSSH
          
          echo "🎉 All deployment steps completed"

      - name: Deployment notification
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment to luxewave.jp successful!"
          else
            echo "❌ Deployment failed. Check logs above."
            exit 1
          fi
